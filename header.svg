<svg width="800" height="300" viewBox="0 0 800 300" fill="none"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Professional gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="spotlightGradient" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="40%" style="stop-color:#1e40af;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.05" />
    </radialGradient>
    
<linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%"   style="stop-color:#67E8F9;stop-opacity:1" />
  <stop offset="50%"  style="stop-color:#0EA5E9;stop-opacity:1" />
  <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
</linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <!-- Professional shadow and glow effects -->
    <filter id="premiumShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feGaussianBlur stdDeviation="4" result="bigBlur"/>
      <feMerge> 
        <feMergeNode in="bigBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Professional animated patterns -->
    <pattern id="techPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <circle cx="20" cy="20" r="1" fill="#3b82f6" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="5" r="0.5" fill="#10b981" opacity="0.15">
        <animate attributeName="opacity" values="0.05;0.25;0.05" dur="3s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="35" cy="35" r="0.8" fill="#64748b" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
    </pattern>
  </defs>

  <style>
    .fade-in {
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
    }
    
    .slide-in-left {
      opacity: 0;
      transform: translateX(-50px);
      animation: slideInLeft 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    .slide-in-right {
      opacity: 0;
      transform: translateX(50px);
      animation: slideInRight 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    .slide-in-up {
      opacity: 0;
      transform: translateY(30px);
      animation: slideInUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    
    .pulse-fast {
      animation: pulse 1s ease-in-out infinite;
    }
    
    .float {
      animation: float 6s ease-in-out infinite;
    }
    
    .float-reverse {
      animation: floatReverse 5s ease-in-out infinite;
    }
    
    .rotate {
      animation: rotate 8s linear infinite;
    }
    
    .rotate-reverse {
      animation: rotateReverse 10s linear infinite;
    }
    
    .scale-pulse {
      animation: scalePulse 3s ease-in-out infinite;
    }
    
    .shimmer {
      animation: shimmer 2s linear infinite;
    }
    
    .typing {
      animation: typing 4s steps(20) infinite;
    }

    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }
    .delay-4 { animation-delay: 0.8s; }
    .delay-5 { animation-delay: 1.0s; }
    .delay-6 { animation-delay: 1.2s; }
    .delay-7 { animation-delay: 1.4s; }
    .delay-8 { animation-delay: 1.6s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
    
    @keyframes slideInLeft {
      to { 
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes slideInRight {
      to { 
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes slideInUp {
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-2deg); }
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes rotateReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    
    @keyframes scalePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    
    @keyframes typing {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .main-name {
      font-size: 42px;
      font-weight: 800;
      font-family: 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 20px;
      font-weight: 600;
      font-family: 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      letter-spacing: 1px;
    }

    .description {
      font-size: 16px;
      font-weight: 400;
      font-family: 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
      letter-spacing: 0.5px;
    }
    
    .link-text {
      font-size: 14px;
      font-weight: 600;
      font-family: 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
      letter-spacing: 0.3px;
    }
    
    .code-text {
      font-size: 18px;
      font-weight: 500;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 0.5px;
    }

    .link-hover:hover {
      opacity: 0.8;
      transform: translateY(-2px) scale(1.05);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .glow-effect {
      filter: drop-shadow(0 0 10px currentColor);
    }
  </style>

  <!-- Premium background with layers -->
  <rect width="800" height="300" fill="url(#bgGradient)" />
  <rect width="800" height="300" fill="url(#spotlightGradient)" />
  <rect width="800" height="300" fill="url(#techPattern)" opacity="0.1" />
  
  <!-- Chat scene: user types, assistant answers (9s loop) -->
  <style>
    .scn { animation: scnFade 9s linear infinite; }
    .a { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .rv { transform-box: fill-box; transform-origin: 0 50%; }
    .msg { font-size: 12.5px; font-weight: 500; font-family: 'Inter','Segoe UI',sans-serif; }
    .ka { animation-name: kA; } .kA { animation-name: kA; } .kB { animation-name: kB; } .kC { animation-name: kC; } .kD { animation-name: kD; }
    @keyframes scnFade { 0%{opacity:0} 1%{opacity:1} 94%{opacity:1} 98%{opacity:0} 100%{opacity:0} }
    @keyframes kA{0%{fill:#475569}4%{fill:#00f5ff}5%{fill:#475569}5%{fill:#00f5ff}6%{fill:#475569}7%{fill:#00f5ff}8%{fill:#475569}15%{fill:#00f5ff}16%{fill:#475569}23%{fill:#00f5ff}24%{fill:#475569}100%{fill:#475569}}
@keyframes kB{0%{fill:#475569}4%{fill:#00f5ff}5%{fill:#475569}6%{fill:#00f5ff}7%{fill:#475569}9%{fill:#00f5ff}10%{fill:#475569}14%{fill:#00f5ff}15%{fill:#475569}19%{fill:#00f5ff}20%{fill:#475569}21%{fill:#00f5ff}22%{fill:#475569}100%{fill:#475569}}
@keyframes kC{0%{fill:#475569}5%{fill:#00f5ff}6%{fill:#475569}10%{fill:#00f5ff}11%{fill:#475569}16%{fill:#00f5ff}17%{fill:#475569}20%{fill:#00f5ff}21%{fill:#475569}100%{fill:#475569}}
@keyframes kD{0%{fill:#475569}4%{fill:#00f5ff}5%{fill:#475569}6%{fill:#00f5ff}7%{fill:#475569}10%{fill:#00f5ff}11%{fill:#475569}21%{fill:#00f5ff}22%{fill:#475569}23%{fill:#00f5ff}24%{fill:#475569}100%{fill:#475569}}

    @keyframes ubub { 0%,2%{opacity:0} 4%,100%{opacity:1} }
    @keyframes bbub { 0%,32%{opacity:0} 34%,100%{opacity:1} }
    @keyframes rvU { 0%,3%{transform:scaleX(0)} 3.01%{transform:scaleX(0);animation-timing-function:steps(23,end)} 28%,100%{transform:scaleX(1)} }
    @keyframes dots { 0%,33%{opacity:0} 34%,45%{opacity:1} 46%,100%{opacity:0} }
    @keyframes dotp { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes rvB1 { 0%,46%{transform:scaleX(0)} 46.01%{transform:scaleX(0);animation-timing-function:steps(28,end)} 66%,100%{transform:scaleX(1)} }
    @keyframes rvB2 { 0%,66%{transform:scaleX(0)} 66.01%{transform:scaleX(0);animation-timing-function:steps(10,end)} 76%,100%{transform:scaleX(1)} }
    .dot { transform-box: fill-box; transform-origin: center; animation: dotp 0.7s ease-in-out infinite; }
  </style>
  <defs>
    <clipPath id="clipU"><rect class="a rv" style="animation-name:rvU" x="82" y="50" width="170" height="20"/></clipPath>
    <clipPath id="clipB1"><rect class="a rv" style="animation-name:rvB1" x="48" y="100" width="190" height="16"/></clipPath>
    <clipPath id="clipB2"><rect class="a rv" style="animation-name:rvB2" x="48" y="118" width="190" height="16"/></clipPath>
  </defs>
  <g class="a scn" style="animation-name:scnFade">
    <rect x="25" y="32" width="245" height="125" rx="16" fill="#0b1220" opacity="0.55" stroke="#334155" stroke-width="1"/>

    <g class="a" style="animation-name:ubub">
      <rect x="72" y="42" width="190" height="34" rx="12" fill="#0ea5e9"/>
      <path d="M 250 76 L 258 84 L 240 76 Z" fill="#0ea5e9"/>
      <text class="msg" x="84" y="64" fill="#ffffff" clip-path="url(#clipU)">Where is my certificate?</text>
    </g>

    <g class="a" style="animation-name:bbub">
      <rect x="35" y="88" width="205" height="56" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <path d="M 48 144 L 42 152 L 62 144 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-linejoin="round"/>
      <g class="a" style="animation-name:dots">
        <circle class="dot" cx="55" cy="116" r="3" fill="#10b981"/>
        <circle class="dot" style="animation-delay:.15s" cx="66" cy="116" r="3" fill="#10b981"/>
        <circle class="dot" style="animation-delay:.3s" cx="77" cy="116" r="3" fill="#10b981"/>
      </g>
      <text class="msg" x="48" y="112" fill="#d1fae5" clip-path="url(#clipB1)">Routing to Certificates agent…</text>
      <text class="msg" x="48" y="130" fill="#34d399" clip-path="url(#clipB2)">Found it ✓</text>
    </g>

    <rect x="42" y="190" width="206" height="76" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect class="a kA" x="52" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="71" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kC" x="90" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kD" x="109" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kA" x="128" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="147" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kC" x="166" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kD" x="185" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kA" x="204" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="223" y="198" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kC" x="58" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kD" x="77" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kA" x="96" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="115" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kC" x="134" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kD" x="153" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kA" x="172" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="191" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kC" x="210" y="214" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kD" x="64" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kA" x="83" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="102" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kC" x="121" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kD" x="140" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kA" x="159" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="178" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kC" x="197" y="230" width="16" height="13" rx="3" fill="#475569"/>
<rect class="a kB" x="90" y="246" width="96" height="13" rx="3" fill="#475569"/>

  </g>

  <!-- Premium Main Content -->
  <g transform="translate(280, 100)">
    <!-- Main name -->
    <text x="0" y="10" class="main-name slide-in-left delay-2" fill="url(#nameGradient)" filter="url(#textGlow)">
      Efrat Bdil
    </text>
    
    <!-- Code accent - more professional -->
    <text x="240" y="15" class="slide-in-right delay-3" fill="#4fd1c7" opacity="0.9" 
          style="font-size: 16px; font-weight: 500; font-family: 'Fira Code', 'Consolas', monospace;">
      { Routing · RAG · Evaluation }
    </text>

    <!-- Subtitle with clean underline -->
    <g class="slide-in-left delay-4">
      <text x="0" y="45" class="subtitle" fill="#e2e8f0">AI Engineer &amp; Full-Stack Developer</text>
      <line x1="0" y1="52" x2="270" y2="52" stroke="url(#accentGradient)" stroke-width="2" opacity="0.7" />
    </g>

    <!-- Description -->
  <text x="0" y="75" class="description fade-in delay-5" fill="#cbd5e0">
    LLM Systems · Agentic AI · Production Chatbots
  </text>
</g>

  <!-- Premium decorative elements -->
  <g opacity="0.15" class="fade-in delay-8">
    <!-- Geometric accent lines -->
    <line x1="0" y1="150" x2="50" y2="150" stroke="url(#accentGradient)" stroke-width="2" opacity="0.4" class="shimmer delay-4"/>
    <line x1="720" y1="100" x2="800" y2="100" stroke="url(#nameGradient)" stroke-width="2" opacity="0.4" class="shimmer delay-5"/>
    
    <!-- Corner accents -->
    <path d="M 0 0 L 30 0 L 30 2 L 2 2 L 2 30 L 0 30 Z" fill="#00f5ff" opacity="0.3"/>
    <path d="M 800 300 L 770 300 L 770 298 L 798 298 L 798 270 L 800 270 Z" fill="#ff6b6b" opacity="0.3"/>
  </g>

</svg>
